name: Test

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check lib/verifier.js
          node -e 'const fs=require("node:fs"); const vm=require("node:vm"); const html=fs.readFileSync("public/index.html","utf8"); const match=html.match(/<script>([\\s\\S]*?)<\\/script>/); if(!match) throw new Error("Dashboard script not found"); new vm.Script(match[1]); console.log("Dashboard JavaScript syntax OK");'
      - name: Run verifier tests
        run: npm test
